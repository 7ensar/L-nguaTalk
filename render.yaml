services:
  # Node.js signaling / WebRTC matchmaking
  # Always-on için Render dashboard'dan plan: starter (veya üstü) seçin.
  - type: web
    name: linguatalk-signaling
    runtime: node
    rootDir: src/signaling-service
    buildCommand: npm install
    startCommand: node src/server.js
    plan: free
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: NODE_ENV
        value: production
      - key: CORS_ORIGIN
        value: https://l-nguatalk.onrender.com
      - key: ASPNET_API_BASE_URL
        value: https://l-nguatalk.onrender.com
      - key: MODERATION_KEY
        value: dev-moderation-key
      # Opsiyonel: Redis URL (çoklu instance Socket.IO). Kuyruk hâlâ process belleğinde.
      - key: REDIS_URL
        sync: false
      - key: MAX_CONNECTIONS
        value: "1500"

  # ASP.NET Core web (Docker)
  - type: web
    name: linguatalk-web
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: Database__Provider
        value: PostgreSQL
      - key: ConnectionStrings__PostgreSQL
        value: Host=aws-0-ap-south-1.pooler.supabase.com;Port=5432;Database=postgres;Username=postgres.oliyycdgzxmjjvjridkp;Password=Ensar123!!.;SSL Mode=Require;Trust Server Certificate=true
      - key: ConnectionStrings__DefaultConnection
        value: Host=aws-0-ap-south-1.pooler.supabase.com;Port=5432;Database=postgres;Username=postgres.oliyycdgzxmjjvjridkp;Password=Ensar123!!.;SSL Mode=Require;Trust Server Certificate=true
      - key: AdminSeed__Email
        value: admin@linguatalk.local
      - key: AdminSeed__Password
        value: Admin123!
      - key: AdminSeed__DisplayName
        value: Sistem Admin
      - key: Signaling__PublicUrl
        value: https://l-nguatalk-1.onrender.com
      - key: Moderation__SignalingModerationKey
        value: dev-moderation-key
      - key: DISABLE_FILE_WATCHERS
        value: "true"
      - key: DOTNET_HOSTBUILDER__RELOADCONFIGONCHANGE
        value: "false"
